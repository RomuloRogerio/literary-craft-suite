<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="auto">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="340" rx="16" fill="url(#bg)" />

  <circle cx="150" cy="170" r="130" fill="#a855f7" opacity="0.10" filter="url(#glow)" />
  <circle cx="1050" cy="170" r="140" fill="#ec4899" opacity="0.12" filter="url(#glow)" />

  <text x="600" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#a855f7" text-anchor="middle">SUÍTE EDITORIAL MULTI-MODELO</text>
  
  <text x="600" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1" fill="#ffffff" text-anchor="middle">LITERARY CRAFT SUITE</text>

  <rect x="520" y="210" width="160" height="4" rx="2" fill="url(#accent)" />

  <text x="600" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1" text-anchor="middle">Crítica Literária Erudita • Ludonarrativa de Livros-Jogos • Purga Cirúrgica Anti-IA</text>
  
  <text x="600" y="285" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">CLAUDE CODE • OPENAI CODEX • GOOGLE GEMINI</text>
</svg>
